[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaleidoscope-v2"
version = "2.0.0"
description = "Headless Google Flow browser automation & Computer Vision 5-in-1 consistent turnaround slicing engine for 3D asset pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "playwright>=1.48.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
kaleidoscope = "kaleidoscope.cli:main"

[tool.setuptools.packages.find]
include = ["kaleidoscope*"]
